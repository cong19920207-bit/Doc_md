# Hayyo 文档工作台：仓库根即站点根。
# 磁盘在 site/ 与 workspace/_kit/；对外 URL 仍是
# /login/、/feature-interaction/、/docs/、/admin-skin-demo/、/kb-admin/。
# H5 用 /prd/... 取文档。磁盘路径打开 HTML 会 302 到对外 URL。
# 未登录整站进 /login/；/api/kb/ 仍由 kb-api 自己鉴权。

map $http_host $kb_std_port {
    default 1;
    "~:80$" 1;
    "~:443$" 1;
    "~:[0-9]+" 0;
}

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # 列出 history/ 目录，供知识库「查看旧版逻辑」解析文件名
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    absolute_redirect off;

    # 本地改 md 后刷新即可看到，不长期缓存
    add_header Cache-Control "no-cache";

    # 仅标准 80/443 且已启用时跳 HTTPS；本机 :18765 不跳
    set $kb_https_redir "";
    if (-f /tls/https.enabled) {
        set $kb_https_redir "${kb_https_redir}e";
    }
    if ($kb_std_port = 1) {
        set $kb_https_redir "${kb_https_redir}s";
    }
    if ($scheme = http) {
        set $kb_https_redir "${kb_https_redir}h";
    }
    if ($kb_https_redir = esh) {
        return 301 https://$host$request_uri;
    }

    # 有 Session 才给页面；登录页与 kb-api 在各自 location 关掉此门
    auth_request /_kb_site_gate;
    error_page 401 = @site_login;

    location = /login {
        auth_request off;
        return 302 /login/;
    }
    location ^~ /login/ {
        auth_request off;
        alias /usr/share/nginx/html/site/login/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location = /feature-interaction {
        return 302 /feature-interaction/;
    }
    location = /docs {
        return 302 /docs/;
    }
    location = /admin-skin-demo {
        return 302 /admin-skin-demo/;
    }
    location = /kb-admin {
        return 302 /kb-admin/;
    }

    location ^~ /feature-interaction/ {
        alias /usr/share/nginx/html/site/feature-interaction/;
        index index.html;
    }

    # 知识问答 kb-api。前缀 /api/kb ，浏览器只打本机反代。
    location = /api/kb {
        auth_request off;
        return 302 /api/kb/;
    }
    location /api/kb/ {
        auth_request off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kb_api http://kb-api:8080;
        proxy_pass $kb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    location = /_kb_site_gate {
        internal;
        auth_request off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kb_api http://kb-api:8080;
        proxy_pass $kb_api/api/kb/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location = /_kb_admin_gate {
        internal;
        auth_request off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kb_api http://kb-api:8080;
        proxy_pass $kb_api/api/kb/auth/admin-gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location @site_login {
        auth_request off;
        return 302 /login/?next=$request_uri;
    }

    location ^~ /kb-admin/ {
        auth_request /_kb_admin_gate;
        error_page 401 = @site_login;
        error_page 403 = @kb_admin_denied;
        alias /usr/share/nginx/html/site/kb-admin/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location @kb_admin_denied {
        auth_request off;
        default_type application/json;
        charset utf-8;
        return 403 '{"ok":false,"message":"没有权限"}';
    }

    location ^~ /docs/ {
        alias /usr/share/nginx/html/site/docs/;
        autoindex on;
        default_type text/plain;
        charset utf-8;
    }

    location ^~ /admin-skin-demo/ {
        alias /usr/share/nginx/html/workspace/_kit/admin-skin/;
        index index.html;
    }

    # 迁目录后的磁盘 URL → 对外别名，避免 ../prd 按错一层
    location = /site/login {
        auth_request off;
        return 302 /login/;
    }
    location ^~ /site/login/ {
        auth_request off;
        rewrite ^/site/login/(.*)$ /login/$1 redirect;
    }
    location = /site/feature-interaction {
        return 302 /feature-interaction/;
    }
    location ^~ /site/feature-interaction/ {
        rewrite ^/site/feature-interaction/(.*)$ /feature-interaction/$1 redirect;
    }
    location = /site/docs {
        return 302 /docs/;
    }
    location ^~ /site/docs/ {
        rewrite ^/site/docs/(.*)$ /docs/$1 redirect;
    }
    location = /workspace/_kit/admin-skin {
        return 302 /admin-skin-demo/;
    }
    location ^~ /workspace/_kit/admin-skin/ {
        rewrite ^/workspace/_kit/admin-skin/(.*)$ /admin-skin-demo/$1 redirect;
    }

    location = /reviews/referral/index.html {
        return 302 /reviews/referral/summary/index.html;
    }

    location = /reviews/getnew/index.html {
        return 302 /reviews/getnew/summary/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location ~* \.json$ {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }
}
