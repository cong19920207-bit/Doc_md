# Hayyo 文档工作台本地静态站。
# Web 只挂生成产物；API 只挂 core-docs。先运行 sh site/preview.sh。
# 仓库根不再放置 docker-compose.yml。
# 推荐：在仓库根执行 sh site/preview.sh（生成产物并刷新容器）
# 仓库根：docker compose -f site/docker-compose.yml up -d
# 环境变量：复制 .env.example 为 .env（本文件同目录）。
# Key 只走 env_file；库地址/本机端口也可写在 .env，缺省与下行默认值相同。
name: hayyo-docs

services:
  web:
    image: nginx:alpine
    container_name: hayyo-docs-web
    restart: unless-stopped
    ports:
      # 已占用/预留：80、3001、3306、3307、6379、8000、15173、18000、18472、18473
      # 本站专用 18765（127.0.0.1），不默认占宿主机 80/443
      - "127.0.0.1:${HAYYO_WEB_PORT:-18765}:80"
      # 默认映射到本机 18769；要标准 HTTPS 时把 HAYYO_TLS_PORT 设为 443
      - "127.0.0.1:${HAYYO_TLS_PORT:-18769}:443"
    volumes:
      - type: bind
        source: ./release/www
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/dummy:ro
      - ./docker/40-tls-certs.sh:/docker-entrypoint.d/40-tls-certs.sh:ro
      - kb-tls-data:/tls:ro
    depends_on:
      kb-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/login/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: hayyo-docs-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HAYYO_QDRANT_HOST_PORT:-18767}:6333"
    volumes:
      - kb-qdrant-data:/qdrant/storage

  mysql:
    image: mysql:8.4
    container_name: hayyo-docs-mysql
    restart: unless-stopped
    ports:
      # 避开本机已占用的 3306/3307，只绑 127.0.0.1
      - "127.0.0.1:${HAYYO_MYSQL_HOST_PORT:-18766}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hayyo_kb_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hayyo_kb}
      MYSQL_USER: ${MYSQL_USER:-hayyo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hayyo_kb_local}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - kb-mysql-data:/var/lib/mysql
      - ./kb-api/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-hayyo_kb_local}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kb-api:
    build:
      context: ./kb-api
    container_name: hayyo-docs-kb-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CORE_DOCS_ROOT: /core-docs
      TLS_DIR: /tls
      DATA_DIR: /data
      ALIASES_PATH: /app/feature_aliases.json
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-hayyo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hayyo_kb_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hayyo_kb}
      DASHSCOPE_BASE: ${DASHSCOPE_BASE:-https://dashscope.aliyuncs.com}
      DEEPSEEK_BASE: ${DEEPSEEK_BASE:-https://api.deepseek.com}
      KB_BOOTSTRAP_USER: ${KB_BOOTSTRAP_USER:-admin}
      KB_BOOTSTRAP_PASSWORD: ${KB_BOOTSTRAP_PASSWORD:-changeme}
    volumes:
      - type: bind
        source: ./core-docs
        target: /core-docs
        read_only: true
        bind:
          create_host_path: false
      - kb-api-data:/data
      - kb-tls-data:/tls
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/kb/health', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 12
      start_period: 15s
    depends_on:
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy

volumes:
  kb-qdrant-data:
  kb-mysql-data:
  kb-api-data:
  kb-tls-data:
