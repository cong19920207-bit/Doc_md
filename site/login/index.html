<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>请先登录</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <form id="loginForm" class="login-form">
      <h1>请先登录</h1>
      <p class="login-lead">登录后查看文档工作台</p>
      <label>用户名
        <input id="loginUser" name="username" type="text" autocomplete="username" required>
      </label>
      <label>密码
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginSubmit" type="submit">登录</button>
      <p id="loginErr" class="login-err" hidden></p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
