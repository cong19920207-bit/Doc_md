<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>确认赠送</title>
<link rel="stylesheet" href="_base.css">
<style>body{width:460px}</style>
</head>
<body>
<div class="caption">「图8」确认赠送 · 二次确认</div>
<div class="hint">至少选中 1 条待赠送。自定义消息有对应语区则覆盖默认「恭喜你获赠奖品{商品名称}」。</div>
<div class="confirm" style="width:400px;text-align:left">
  <h2 style="text-align:center;font-size:15px;margin-bottom:12px">确认赠送</h2>
  <p style="font-size:13px;color:#555;margin-bottom:12px">将对选中的 1 条待赠送记录执行赠送。</p>
  <div class="form-row">
    <div class="lab">自定义消息 EN</div>
    <div class="fld"><input placeholder="可选"></div>
  </div>
  <div class="form-row">
    <div class="lab">自定义消息 AR</div>
    <div class="fld"><input placeholder="可选"></div>
  </div>
  <div class="form-row">
    <div class="lab">自定义消息 TR</div>
    <div class="fld"><input placeholder="可选"></div>
  </div>
  <div class="btns">
    <span class="btn">取消</span>
    <span class="btn solid">确认赠送</span>
  </div>
</div>
<div class="note">成功后：背包对应分类入账；获得即倒计时；获得记录写一条；失效时间 = 赠送时间 + 时长。该分类从 0 到 1 才自动使用。</div>
</body>
</html>
